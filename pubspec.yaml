name: tht_app
description: The Home Tuitions Pro — Flutter mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3+1

  # Auth / Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  jwt_decoder: ^2.0.1

  # UI
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  pinput: ^5.0.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.0

  # Payments
  razorpay_flutter: ^1.3.7

  # Utilities
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # Plus Jakarta Sans — the same face the website sets in globals.css.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  assets:
    - assets/images/
    - assets/images/boards/

# Launcher icon generated from the brand mark: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: assets/images/logo.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo.png
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#E1702E"

# Native splash generated with: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F172A"
  image: assets/images/logo.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#0F172A"
    image: assets/images/logo.png
